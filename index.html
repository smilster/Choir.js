<!DOCTYPE html>
<html lang="en">
<head>


    <title>Choir.js</title>

    <!-- Social Platform Preview -->
    <meta property="og:title" content="Choir.js">
    <meta property="og:description"
          content="An inspiring music composition assistant that generates, visualizes and plays back small multi-voice passages.">
    <meta property="og:image" content="https://smilster.github.io/Choir.js/img/thumb.jpg">
    <meta property="og:url" content="https://smilster.github.io/Choir.js">
    <meta property="og:type" content="website">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">

    <!-- Custom CSS (should come after Bootstrap so it overrides some defaults) -->
    <link href="css/styles.css" rel="stylesheet">

    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>

    <script
            src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.min.js"
            integrity="sha384-sXh53A89RHUqXEpTnZ7DpSstopIKPxEghisKJVfwdvDGuIp7c54pvPvpRpUVhjou"
            crossorigin="anonymous">
    </script>

    <script
            src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.min.js"
            integrity="sha384-YZCsFif8KY+K9vRD3/HMNljdSU1PyDcnuMO9lcnPs9Up0SqkyJTgh+BFF6YhkIWg"
            crossorigin="anonymous">
    </script>

    <!--    Choir.js scripts-->


    <!--
    #########################################
    #########################################
    #########################################
    #########################################
    -->

    <!-- functions and constants -->
    <script src="js/tools.js"></script>
    <script src="js/debugTree.js"></script>

    <!--handles tooltips and displays tutorial-->
    <script src="js/Help.js"></script>
    <script src="js/Tutorial.js"></script>
    <!--generic music helper functions-->
    <script src="js/Music.js"></script>

    <script src="samples/Instruments.js"></script>

    <!-- classes -->
    <!-- main class -->
    <script src="js/Choir.js"></script>

    <!-- class to store relevant properties for each voice -->
    <script src="js/Voice.js"></script>

    <!-- note parser generates vexflow stave notes and playNotes and schedules for toneJS -->
    <script src="js/NoteParser.js"></script>
    <script src="js/NoteGenerator.js"></script>


    <!-- upper pannel, vexflow context, transport button, key-selector and add-voice button -->
    <script src="js/NoteSheet.js"></script>
    <script src="js/Transport.js"></script>
    <script src="js/KeySelector.js"></script>
    <!-- audioPlayer loads samples and controls transport -->
    <script src="js/AudioBuffer.js"></script>

    <!-- voice control panel containing tabs, and manages adding and removing voices  -->
    <script src="js/VoiceControl.js"></script>
    <script src="js/Name.js"></script>


    <!-- control tab class for voice control panel on r.h.s with scale selector, voice range, klaviatur for showing scale and picking voice range, rhythm selector and buttons for clearing or generating notes  -->
    <script src="js/VoiceControlTab.js"></script>
    <script src="js/ScaleSelector.js"></script>
    <script src="js/RangeSelector.js"></script>
    <script src="js/Transpose.js"></script>
    <script src="js/RhythmSelector.js"></script>

    <!-- mixer to control playback and pick instrument -->
    <script src="js/Mixer.js"></script>
    <script src="js/Channel.js"></script>
    <script src="js/InstrumentSelector.js"></script>
    <!-- controls inter-voice intervals and shows input interval matrix for manipulation -->
    <script src="js/Interval.js"></script>


</head>


<body>
<div class="w-100">
    <div class="mx-auto" id="choirContainer">
    </div>
</div>
</body>


<script>
    Choir.initialize("choirContainer");
</script>

</html>
